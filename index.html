<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Per-page title, description, and canonical are set by react-helmet-async
      in each page component and written into each page's HTML at build time
      by scripts/prerender.mjs. Do NOT add a static canonical or meta description
      here: it would apply to every route in the raw HTML and tell Google that
      every page is a duplicate of the homepage.
    -->
    <title>BerksAI | AI Training & Consulting in Reading and Berks County, PA</title>
    <meta name="author" content="BerksAI" />

    <!-- Open Graph / Facebook (generic defaults for crawlers that do not run JavaScript) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BerksAI | On-Site AI Prompt Training & Consulting" />
    <meta property="og:description" content="On-site AI prompt training and consulting for Berks County and Eastern Pennsylvania businesses." />
    <meta property="og:image" content="https://berksai.com/og-image.jpg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="BerksAI" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="BerksAI | On-Site AI Prompt Training & Consulting" />
    <meta property="twitter:description" content="On-site AI prompt training and consulting for Berks County and Eastern Pennsylvania businesses." />
    <meta property="twitter:image" content="https://berksai.com/og-image.jpg" />

    <!-- Structured Data - Organization (for logo) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BerksAI",
      "url": "https://berksai.com",
      "logo": "https://berksai.com/icon-512.png",
      "sameAs": []
    }
    </script>

    <!-- Structured Data - LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "BerksAI",
      "description": "On-site AI prompt training and consulting for businesses in Reading, Berks County, Lancaster, King of Prussia, Philadelphia, and Eastern Pennsylvania.",
      "url": "https://berksai.com",
      "telephone": "+1-267-357-8007",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Oley",
        "addressRegion": "PA",
        "addressCountry": "US"
      },
      "areaServed": [
        { "@type": "City", "name": "Reading, PA" },
        { "@type": "City", "name": "Wyomissing, PA" },
        { "@type": "City", "name": "West Reading, PA" },
        { "@type": "City", "name": "Kutztown, PA" },
        { "@type": "City", "name": "Oley, PA" },
        { "@type": "AdministrativeArea", "name": "Berks County, PA" },
        { "@type": "City", "name": "Lancaster, PA" },
        { "@type": "City", "name": "King of Prussia" },
        { "@type": "AdministrativeArea", "name": "Montgomery County" },
        { "@type": "City", "name": "Philadelphia" },
        { "@type": "AdministrativeArea", "name": "Philadelphia County" },
        { "@type": "AdministrativeArea", "name": "Chester County" },
        { "@type": "AdministrativeArea", "name": "Lancaster County" },
        { "@type": "AdministrativeArea", "name": "Lehigh County" },
        { "@type": "AdministrativeArea", "name": "Delaware County" },
        { "@type": "State", "name": "Pennsylvania" }
      ],
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
